<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About | Serhii Prytula</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="assets/images/favicon/Favicon_Serhii_Prytula.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap');
        
        :root { 
            --bg-color: #0a0a0a; 
            --text-main: #ffffff; 
            --text-muted: #888888; 
            --accent: #ff6b35; 
            --hud-bg: rgba(10, 10, 10, 0.6); 
            --hud-border: rgba(255, 255, 255, 0.08); 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            overflow-x: hidden; 
            scrollbar-gutter: stable; /* ДОДАНО: резервує місце під скролбар */
            min-height: 100vh; 
        }

        /* --- CUSTOM GLOBAL SCROLLBAR (ЯК В INDEX.HTML) --- */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; margin: 24px 0; }
        ::-webkit-scrollbar-thumb {
            background: var(--accent); border-radius: 10px; border: 2px solid transparent;
            background-clip: content-box; margin-right: 16px; /* ЗСУВ СКРОЛБАРУ ЛІВОРУЧ */
        }
        ::-webkit-scrollbar-thumb:hover { background: #ff8c5a; }
        
        /* HUD STYLES (УЗГОДЖЕНО З INDEX.HTML) */
        .hud-wrapper { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: center; z-index: 1000; pointer-events: none; }
        .hud-nav { 
            pointer-events: auto; background: var(--hud-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); 
            border: 1px solid var(--hud-border); border-top: none; border-radius: 0 0 24px 24px; 
            padding: 18px 25px; width: 70%; max-width: 1050px; /* ОНОВЛЕНО РОЗМІР */
            display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 30px; /* ОНОВЛЕНО СІТКУ */
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); transition: transform 0.3s ease; 
        }

        /* --- ЗМІНЕНО ТУТ: ЗБІЛЬШЕНО РОЗМІР ТА ЗСУНУТО ВПРАВО --- */
        .logo-link { 
            display: flex; align-items: center; justify-content: center; 
            transition: transform 0.3s ease; pointer-events: auto;
            padding-left: 15px; /* Зсув іконки трохи вправо */
        }
        .logo-link:hover { transform: scale(1.1); }
        .logo-link img { 
            height: 54px; /* Збільшили розмір іконки */
            width: auto; 
        }

        .nav-links { display: flex; list-style: none; gap: 28px; justify-content: center; }
        .nav-links a { text-decoration: none; color: var(--text-muted); font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s; cursor: pointer; position: relative; }
        .nav-links a:hover, .nav-links a.active-link { color: var(--text-main); text-shadow: 0 0 12px rgba(255,255,255,0.3); }
        .nav-links a.active-link::after { content: ''; position: absolute; bottom: -6px; left: 0; width: 100%; height: 2px; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
        .btn-contact { border: 1px solid var(--accent); padding: 8px 20px; border-radius: 30px; color: var(--accent) !important; transition: all 0.3s; }
        .btn-contact:hover { background: var(--accent); color: #fff !important; box-shadow: 0 0 15px rgba(255, 107, 53, 0.4); }
        .btn-contact::after { display: none !important; }
        .lang-switch { display: flex; gap: 12px; justify-content: flex-end; }
        .lang-btn { background: none; border: none; color: var(--text-muted); font-weight: 700; cursor: pointer; font-size: 15px; transition: color 0.3s; }
        .lang-btn.active-lang { color: var(--text-main); }

        /* ABOUT SECTION STYLES */
        .about-page-container { position: relative; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 180px 20px 60px; overflow: hidden; }
        .about-static-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('assets/images/hero/Mjolnir__Upper_Preview_Serhii_Anotomic_Prytula.jpg'); background-size: cover; background-position: center; filter: brightness(0.4); z-index: 0; }
        .about-card { position: relative; z-index: 1; background-color: #1e1e1e; border-radius: 30px; padding: 60px; width: 95%; max-width: 1600px; display: flex; align-items: center; gap: 60px; box-shadow: 0 30px 80px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.05); }
        .about-content { flex: 1; }
        
        /* ФІКС ДЛЯ УКРАЇНСЬКОЇ ВЕРСІЇ: ЗАБОРОНА ПЕРЕНОСУ */
        .about-name { 
            font-size: clamp(1.8rem, 3.5vw, 2.8rem); 
            font-weight: 900; margin: 0 0 15px 0; line-height: 1.2; color: var(--text-main); 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
        }
        
        .about-role { font-size: 1.3rem; color: #b0b0b0; margin: 0 0 35px 0; font-weight: 500; letter-spacing: 0.5px; }
        .skills-container { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 40px; }
        .skill-pill { background-color: #2a2a2a; color: var(--accent); padding: 12px 24px; border-radius: 50px; font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 10px; border: 1px solid rgba(255, 107, 53, 0.15); transition: all 0.3s ease; }
        .skill-pill:hover { border-color: var(--accent); background-color: rgba(255, 107, 53, 0.08); transform: translateY(-2px); }
        .social-links { display: flex; gap: 20px; }
        .social-icon { color: var(--accent); font-size: 1.6rem; text-decoration: none; transition: transform 0.2s ease, opacity 0.2s ease; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: rgba(255, 107, 53, 0.05); }
        .social-icon:hover { transform: scale(1.15); opacity: 0.8; background: rgba(255, 107, 53, 0.15); }
        .about-image-wrapper { flex-shrink: 0; width: 350px; height: 350px; position: relative; }
        .about-avatar { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 4px solid var(--accent); box-shadow: 0 0 40px rgba(255, 107, 53, 0.2); }

        @media (max-width: 1000px) {
            .hud-nav { 
                grid-template-columns: auto 1fr; 
                width: 90%; padding: 15px 20px; gap: 15px; 
            }
            .nav-links { flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 10px; grid-column: 1 / -1; }
            .lang-switch { justify-content: center; margin-top: 5px; grid-column: 1 / -1; }
            
            /* АДАПТАЦІЯ ЛОГОТИПУ ДЛЯ МОБІЛЬНИХ */
            .logo-link { justify-self: start; padding-left: 5px; }
            .logo-link img { height: 42px; }
            
            .about-card { flex-direction: column-reverse; text-align: center; padding: 30px 20px; gap: 30px; width: 95%; }
            .skills-container { justify-content: center; }
            .social-links { justify-content: center; }
            .about-image-wrapper { width: 240px; height: 240px; }
            .about-page-container { padding-top: 140px; }
        }
    </style>
</head>
<body>
    <!-- HUD NAVIGATION -->
    <div class="hud-wrapper">
        <nav class="hud-nav">
            <!-- ЛОГОТИП ЗЛІВА (Посилання на головну) -->
            <a href="index.html" class="logo-link" title="Головна">
                <img src="assets/images/favicon/Favicon_Serhii_Prytula.png" alt="Logo">
            </a>

            <ul class="nav-links">
                <!-- ЗАМІНЕНО "ГОЛОВНА" НА "ПОСЛУГИ" ДЛЯ ЄДНОСТІ -->
                <li><a href="services.html" data-key="nav_services">Послуги</a></li>
                <li><a href="portfolio.html" data-key="nav_port">Портфоліо</a></li>
                <li><a href="about.html" id="link-about" class="active-link" data-key="nav_about">Про мене</a></li>
                <li><a href="tutorials.html" data-key="nav_tutorials">Навчання</a></li>
                <li><a href="blog.html" data-key="nav_blog">Блог</a></li>
                <li><a href="contact.html" class="btn-contact" data-key="nav_contact">Зв'язатися</a></li>
            </ul>
            
            <div class="lang-switch">
                <button class="lang-btn active-lang" onclick="setLang('uk')">UA</button>
                <button class="lang-btn" onclick="setLang('en')">EN</button>
            </div>
        </nav>
    </div>

    <!-- ABOUT CONTENT ONLY -->
    <section class="about-page-container">
        <div class="about-static-bg"></div>
        <div class="about-card">
            <div class="about-content">
                <h1 class="about-name" data-key="about_name">Сергій В'ячеславович Притула</h1>
                <p class="about-role" data-key="about_role">Традиційний та цифровий 3D-скульптор персонажів, Україна</p>
                <div class="skills-container">
                    <div class="skill-pill"><i class="fas fa-paint-brush"></i> <span data-key="skill_1">Character Design</span></div>
                    <div class="skill-pill"><i class="fas fa-cube"></i> <span data-key="skill_2">Sculpting</span></div>
                    <div class="skill-pill"><i class="fas fa-fill-drip"></i> <span data-key="skill_3">Texturing</span></div>
                    <div class="skill-pill"><i class="fas fa-camera"></i> <span data-key="skill_4">Rendering</span></div>
                </div>
                <div class="social-links">
                    <a href="https://www.artstation.com/anotomic" target="_blank" class="social-icon" title="ArtStation"><i class="fab fa-artstation"></i></a>
                    <a href="https://www.instagram.com/anotomic/" target="_blank" class="social-icon" title="Instagram"><i class="fab fa-instagram"></i></a>
                    <a href="https://www.linkedin.com/in/serhii-prytula-0a96a52a6/" target="_blank" class="social-icon" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                    <a href="https://t.me/Anotomic" target="_blank" class="social-icon" title="Telegram Community"><i class="fab fa-telegram-plane"></i></a>
                </div>
            </div>
            <div class="about-image-wrapper">
                <img src="assets/images/about/Serhii_Prytula.jpg" alt="Serhii Prytula Avatar" class="about-avatar">
            </div>
        </div>
    </section>

    <!-- SCRIPT ДЛЯ МОВИ -->
    <script>
        const i18n = {
            uk: { 
                nav_services: "Послуги", nav_port: "Портфоліо", nav_about: "Про мене", nav_tutorials: "Навчання", nav_blog: "Блог", nav_contact: "Зв'язатися", 
                about_name: "Сергій В'ячеславович Притула", about_role: "Традиційний та цифровий 3D-скульптор персонажів, Україна", 
                skill_1: "Character Design", skill_2: "Sculpting", skill_3: "Texturing", skill_4: "Rendering" 
            },
            en: { 
                nav_services: "Services", nav_port: "Portfolio", nav_about: "About", nav_tutorials: "Tutorials", nav_blog: "Blog", nav_contact: "Contact Me", 
                about_name: "Serhii Viacheslavovych Prytula", about_role: "Traditional & Digital 3D Character Sculptor based in Ukraine.", 
                skill_1: "Character Design", skill_2: "Sculpting", skill_3: "Texturing", skill_4: "Rendering" 
            }
        };
        function setLang(lang) {
            localStorage.setItem('site_lang', lang);
            document.querySelectorAll('[data-key]').forEach(el => { const key = el.getAttribute('data-key'); if(i18n[lang][key]) el.innerText = i18n[lang][key]; });
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active-lang'));
            document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active-lang');
        }
        const savedLang = localStorage.getItem('site_lang') || 'uk'; setLang(savedLang);
    </script>
</body>
</html>
