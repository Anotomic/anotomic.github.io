<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Serhii Prytula</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="assets/images/favicon/Favicon_Serhii_Prytula.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap');

        :root {
            --bg-color: #0a0a0a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #ff6b35;
            --hud-bg: rgba(10, 10, 10, 0.6);
            --hud-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            scrollbar-gutter: stable; /* ДОДАНО: резервує місце під скролбар */
            min-height: 100vh;
        }

        /* --- CUSTOM GLOBAL SCROLLBAR (ЯК В INDEX.HTML) --- */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; margin: 24px 0; }
        ::-webkit-scrollbar-thumb {
            background: var(--accent); border-radius: 10px; border: 2px solid transparent;
            background-clip: content-box; margin-right: 16px; /* ЗСУВ СКРОЛБАРУ ЛІВОРУЧ */
        }
        ::-webkit-scrollbar-thumb:hover { background: #ff8c5a; }

        /* --- HUD NAVIGATION (УЗГОДЖЕНО З INDEX.HTML) --- */
        .hud-wrapper {
            position: fixed; top: 0; left: 0; right: 0;
            display: flex; justify-content: center; z-index: 1000; pointer-events: none;
        }
        .hud-nav {
            pointer-events: auto; background: var(--hud-bg);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--hud-border); border-top: none; 
            border-radius: 0 0 24px 24px; padding: 18px 25px; 
            width: 70%; max-width: 1050px; /* ОНОВЛЕНО РОЗМІР */
            display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 30px; /* ОНОВЛЕНО СІТКУ */
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }

        /* --- ЗМІНЕНО ТУТ: ЗБІЛЬШЕНО РОЗМІР ТА ЗСУНУТО ВПРАВО --- */
        .logo-link { 
            display: flex; align-items: center; justify-content: center; 
            transition: transform 0.3s ease; pointer-events: auto;
            padding-left: 15px; /* Зсув іконки трохи вправо */
        }
        .logo-link:hover { transform: scale(1.1); }
        .logo-link img { 
            height: 54px; /* Збільшили розмір іконки */
            width: auto; 
        }

        .nav-links { display: flex; list-style: none; gap: 28px; justify-content: center; }
        .nav-links a {
            text-decoration: none; color: var(--text-muted); font-size: 15px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s; cursor: pointer; position: relative;
        }
        .nav-links a:hover, .nav-links a.active-link { color: var(--text-main); text-shadow: 0 0 12px rgba(255,255,255,0.3); }
        .nav-links a.active-link::after {
            content: ''; position: absolute; bottom: -6px; left: 0; width: 100%; height: 2px;
            background: var(--accent); box-shadow: 0 0 8px var(--accent);
        }
        .btn-contact {
            border: 1px solid var(--accent); padding: 8px 20px; border-radius: 30px;
            color: var(--accent) !important; transition: all 0.3s;
        }
        .btn-contact:hover { background: var(--accent); color: #fff !important; box-shadow: 0 0 15px rgba(255, 107, 53, 0.4); }
        .btn-contact::after { display: none !important; }
        .lang-switch { display: flex; gap: 12px; justify-content: flex-end; }
        .lang-btn { background: none; border: none; color: var(--text-muted); font-weight: 700; cursor: pointer; font-size: 15px; transition: color 0.3s; }
        .lang-btn.active-lang { color: var(--text-main); }

        /* --- BLOG SECTION STYLES (EMPTY STATE) --- */
        .blog-container {
            padding: 160px 20px 80px;
            max-width: 900px;
            margin: 0 auto;
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .blog-header { margin-bottom: 0; }

        .blog-title {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 900;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .blog-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.6;
            max-width: 600px;
        }

        .empty-state-icon {
            font-size: 3rem;
            color: rgba(255, 107, 53, 0.2);
            margin-bottom: 20px;
        }

        /* Адаптивність */
        @media (max-width: 1000px) {
            .hud-nav { 
                grid-template-columns: auto 1fr; 
                width: 90%; padding: 15px 20px; gap: 15px; 
            }
            .nav-links { flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 10px; grid-column: 1 / -1; }
            .lang-switch { justify-content: center; margin-top: 5px; grid-column: 1 / -1; }
            
            /* АДАПТАЦІЯ ЛОГОТИПУ ДЛЯ МОБІЛЬНИХ */
            .logo-link { justify-self: start; padding-left: 5px; }
            .logo-link img { height: 42px; }
            
            .blog-container { padding-top: 140px; }
        }
    </style>
</head>
<body>

    <!-- HUD NAVIGATION -->
    <div class="hud-wrapper">
        <nav class="hud-nav">
            <!-- ЛОГОТИП ЗЛІВА (Посилання на головну) -->
            <a href="index.html" class="logo-link" title="Головна">
                <img src="assets/images/favicon/Favicon_Serhii_Prytula.png" alt="Logo">
            </a>

            <ul class="nav-links">
                <!-- ЗАМІНЕНО "ГОЛОВНА" НА "ПОСЛУГИ" ДЛЯ ЄДНОСТІ -->
                <li><a href="services.html" data-key="nav_services">Послуги</a></li>
                <li><a href="portfolio.html" data-key="nav_port">Портфоліо</a></li>
                <li><a href="about.html" data-key="nav_about">Про мене</a></li>
                <li><a href="tutorials.html" data-key="nav_tutorials">Навчання</a></li>
                <!-- АКТИВНИЙ СТАН НА БЛОГ -->
                <li><a href="blog.html" id="link-blog" class="active-link" data-key="nav_blog">Блог</a></li>
                <li><a href="contact.html" class="btn-contact" data-key="nav_contact">Зв'язатися</a></li>
            </ul>
            
            <div class="lang-switch">
                <button class="lang-btn active-lang" onclick="setLang('uk')">UA</button>
                <button class="lang-btn" onclick="setLang('en')">EN</button>
            </div>
        </nav>
    </div>

    <!-- BLOG CONTENT (EMPTY) -->
    <section class="blog-container">
        <div class="blog-header">
            <i class="fas fa-pen-nib empty-state-icon"></i>
            <h1 class="blog-title" data-key="blog_title">Блог</h1>
            <p class="blog-subtitle" data-key="blog_desc">Туторіали, інсайти з індустрії та процес створення персонажів. Скоро тут з'являться перші публікації.</p>
        </div>
    </section>

    <!-- SCRIPT ДЛЯ МОВИ -->
    <script>
        const i18n = {
            uk: { 
                nav_services: "Послуги", nav_port: "Портфоліо", nav_about: "Про мене", nav_tutorials: "Навчання", nav_blog: "Блог", nav_contact: "Зв'язатися",
                blog_title: "Блог", 
                blog_desc: "Туторіали, інсайти з індустрії та процес створення персонажів. Скоро тут з'являться перші публікації."
            },
            en: { 
                nav_services: "Services", nav_port: "Portfolio", nav_about: "About", nav_tutorials: "Tutorials", nav_blog: "Blog", nav_contact: "Contact Me",
                blog_title: "Blog", 
                blog_desc: "Tutorials, industry insights, and character creation process. First posts coming soon."
            }
        };

        function setLang(lang) {
            localStorage.setItem('site_lang', lang);
            document.querySelectorAll('[data-key]').forEach(el => { 
                const key = el.getAttribute('data-key'); 
                if(i18n[lang][key]) el.innerText = i18n[lang][key]; 
            });
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active-lang'));
            document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active-lang');
        }

        const savedLang = localStorage.getItem('site_lang') || 'uk'; setLang(savedLang);
    </script>
</body>
</html>
