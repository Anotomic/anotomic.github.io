<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Serhii Prytula</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap');

        :root {
            --bg-color: #0a0a0a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #ff6b35;
            --hud-bg: rgba(10, 10, 10, 0.6);
            --hud-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- HUD NAVIGATION --- */
        .hud-wrapper { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: center; z-index: 1000; pointer-events: none; }
        .hud-nav { pointer-events: auto; background: var(--hud-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid var(--hud-border); border-top: none; border-radius: 0 0 24px 24px; padding: 22px 30px; width: 60%; max-width: 900px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; box-shadow: 0 10px 40px rgba(0,0,0,0.5); transition: transform 0.3s ease; }
        .nav-spacer { visibility: hidden; }
        .nav-links { display: flex; list-style: none; gap: 35px; justify-content: center; }
        .nav-links a { text-decoration: none; color: var(--text-muted); font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s; cursor: pointer; position: relative; }
        .nav-links a:hover, .nav-links a.active-link { color: var(--text-main); text-shadow: 0 0 12px rgba(255,255,255,0.3); }
        .nav-links a.active-link::after { content: ''; position: absolute; bottom: -6px; left: 0; width: 100%; height: 2px; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
        .btn-contact { border: 1px solid var(--accent); padding: 8px 20px; border-radius: 30px; color: var(--accent) !important; transition: all 0.3s; }
        .btn-contact:hover { background: var(--accent); color: #fff !important; box-shadow: 0 0 15px rgba(255, 107, 53, 0.4); }
        .btn-contact::after { display: none !important; }
        .lang-switch { display: flex; gap: 12px; justify-content: flex-end; padding-left: 20px; }
        .lang-btn { background: none; border: none; color: var(--text-muted); font-weight: 700; cursor: pointer; font-size: 15px; transition: color 0.3s; }
        .lang-btn.active-lang { color: var(--text-main); }

        /* --- CONTACT SECTION (SIMPLIFIED) --- */
        .contact-container {
            padding: 160px 20px 80px;
            max-width: 800px;
            margin: 0 auto;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .contact-header { margin-bottom: 50px; }

        .contact-title {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 900;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .contact-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.6;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Cards for contacts */
        .contact-cards {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .contact-card {
            background: #1e1e1e;
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 30px;
            width: 280px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .contact-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.1);
        }

        .card-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 107, 53, 0.1);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Адаптивність */
        @media (max-width: 1000px) {
            .hud-nav { grid-template-columns: 1fr; width: 90%; padding: 20px; gap: 15px; }
            .nav-spacer { display: none; }
            .nav-links { flex-wrap: wrap; justify-content: center; gap: 20px; }
            .lang-switch { justify-content: center; padding-left: 0; margin-top: 5px; }
            .contact-container { padding-top: 140px; }
        }

        @media (max-width: 600px) {
            .contact-cards { flex-direction: column; align-items: center; }
            .contact-card { width: 100%; max-width: 320px; }
        }
    </style>
</head>
<body>

    <!-- HUD NAVIGATION -->
    <div class="hud-wrapper">
        <nav class="hud-nav">
            <div class="nav-spacer"></div>
            <ul class="nav-links">
                <li><a href="index.html" id="link-home" data-key="nav_home">Головна</a></li>
                <li><a href="portfolio.html" id="link-portfolio" data-key="nav_port">Портфоліо</a></li>
                <li><a href="about.html" id="link-about" data-key="nav_about">Про мене</a></li>
                <li><a href="blog.html" id="link-blog" data-key="nav_blog">Блог</a></li>
                <li><a href="contact.html" id="link-contact" class="active-link btn-contact" data-key="nav_contact">Зв'язатися</a></li>
            </ul>
            <div class="lang-switch">
                <button class="lang-btn active-lang" onclick="setLang('uk')">UA</button>
                <button class="lang-btn" onclick="setLang('en')">EN</button>
            </div>
        </nav>
    </div>

    <!-- CONTACT CONTENT -->
    <section class="contact-container">
        <div class="contact-header">
            <h1 class="contact-title" data-key="contact_title">Зв'язатися</h1>
            <p class="contact-subtitle" data-key="contact_desc">Найшвидший спосіб обговорити проєкт або навчання — написати мені напряму.</p>
        </div>

        <div class="contact-cards">
            <!-- TELEGRAM CARD -->
            <a href="https://t.me/Anotomic" target="_blank" class="contact-card">
                <div class="card-icon"><i class="fab fa-telegram-plane"></i></div>
                <div class="card-title" data-key="card_tg_title">Telegram</div>
                <div class="card-desc" data-key="card_tg_desc">Напишіть мені в особисті. Відповідаю швидко. Можна скидати референси.</div>
            </a>

            <!-- EMAIL CARD -->
            <a href="mailto:your-email@example.com" class="contact-card">
                <div class="card-icon"><i class="fas fa-envelope"></i></div>
                <div class="card-title" data-key="card_email_title">Email</div>
                <div class="card-desc" data-key="card_email_desc">Для офіційних пропозицій та деталей співпраці.</div>
            </a>
        </div>
    </section>

    <!-- SCRIPT ДЛЯ МОВИ -->
    <script>
        const i18n = {
            uk: { 
                nav_home: "Головна", nav_port: "Портфоліо", nav_about: "Про мене", nav_blog: "Блог", nav_contact: "Зв'язатися",
                contact_title: "Зв'язатися",
                contact_desc: "Найшвидший спосіб обговорити проєкт або навчання — написати мені напряму.",
                card_tg_title: "Telegram", card_tg_desc: "Напишіть мені в особисті. Відповідаю швидко. Можна скидати референси.",
                card_email_title: "Email", card_email_desc: "Для офіційних пропозицій та деталей співпраці."
            },
            en: { 
                nav_home: "Home", nav_port: "Portfolio", nav_about: "About", nav_blog: "Blog", nav_contact: "Contact Me",
                contact_title: "Contact Me",
                contact_desc: "The fastest way to discuss a project or mentorship is to message me directly.",
                card_tg_title: "Telegram", card_tg_desc: "DM me directly. Fast response. Feel free to send references.",
                card_email_title: "Email", card_email_desc: "For official proposals and collaboration details."
            }
        };

        function setLang(lang) {
            localStorage.setItem('site_lang', lang);
            document.querySelectorAll('[data-key]').forEach(el => { 
                const key = el.getAttribute('data-key'); 
                if(i18n[lang][key]) el.innerText = i18n[lang][key]; 
            });
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active-lang'));
            document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active-lang');
        }
        const savedLang = localStorage.getItem('site_lang') || 'uk'; setLang(savedLang);
    </script>
</body>
</html>
