<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Serhii Prytula</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap');

        :root {
            --bg-color: #0a0a0a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #ff6b35;
            --hud-bg: rgba(10, 10, 10, 0.6);
            --hud-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- HUD NAVIGATION --- */
        .hud-wrapper { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: center; z-index: 1000; pointer-events: none; }
        .hud-nav { pointer-events: auto; background: var(--hud-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid var(--hud-border); border-top: none; border-radius: 0 0 24px 24px; padding: 22px 30px; width: 60%; max-width: 900px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; box-shadow: 0 10px 40px rgba(0,0,0,0.5); transition: transform 0.3s ease; }
        .nav-spacer { visibility: hidden; }
        .nav-links { display: flex; list-style: none; gap: 35px; justify-content: center; }
        .nav-links a { text-decoration: none; color: var(--text-muted); font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s; cursor: pointer; position: relative; }
        .nav-links a:hover, .nav-links a.active-link { color: var(--text-main); text-shadow: 0 0 12px rgba(255,255,255,0.3); }
        .nav-links a.active-link::after { content: ''; position: absolute; bottom: -6px; left: 0; width: 100%; height: 2px; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
        .btn-contact { border: 1px solid var(--accent); padding: 8px 20px; border-radius: 30px; color: var(--accent) !important; transition: all 0.3s; }
        .btn-contact:hover { background: var(--accent); color: #fff !important; box-shadow: 0 0 15px rgba(255, 107, 53, 0.4); }
        .btn-contact::after { display: none !important; }
        .lang-switch { display: flex; gap: 12px; justify-content: flex-end; padding-left: 20px; }
        .lang-btn { background: none; border: none; color: var(--text-muted); font-weight: 700; cursor: pointer; font-size: 15px; transition: color 0.3s; }
        .lang-btn.active-lang { color: var(--text-main); }

        /* --- CONTACT SECTION --- */
        .contact-container {
            padding: 160px 20px 80px;
            max-width: 1000px;
            margin: 0 auto;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .contact-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .contact-title {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 900;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .contact-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Grid для контактів та форми */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 40px;
            align-items: start;
        }

        /* Блок прямих контактів */
        .direct-contacts {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.2s ease;
        }
        .contact-item:last-child { margin-bottom: 0; }
        .contact-item:hover { transform: translateX(5px); color: var(--accent); }

        .contact-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 107, 53, 0.1);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .contact-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .contact-value {
            font-size: 1rem;
            font-weight: 600;
        }

        /* Форма */
        .contact-form {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .form-group { margin-bottom: 20px; }

        .form-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-input, .form-textarea {
            width: 100%;
            background: #0a0a0a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 14px 18px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            outline: none;
        }

        .form-input:focus, .form-textarea:focus {
            border-color: var(--accent);
        }

        .form-textarea {
            resize: vertical;
            min-height: 120px;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent) 0%, #e55a2b 100%);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 107, 53, 0.3);
        }

        /* Адаптивність */
        @media (max-width: 1000px) {
            .hud-nav { grid-template-columns: 1fr; width: 90%; padding: 20px; gap: 15px; }
            .nav-spacer { display: none; }
            .nav-links { flex-wrap: wrap; justify-content: center; gap: 20px; }
            .lang-switch { justify-content: center; padding-left: 0; margin-top: 5px; }
            
            .contact-container { padding-top: 140px; }
            .contact-grid { grid-template-columns: 1fr; gap: 30px; }
        }
    </style>
</head>
<body>

    <!-- HUD NAVIGATION -->
    <div class="hud-wrapper">
        <nav class="hud-nav">
            <div class="nav-spacer"></div>
            <ul class="nav-links">
                <li><a href="index.html" id="link-home" data-key="nav_home">Головна</a></li>
                <li><a href="portfolio.html" id="link-portfolio" data-key="nav_port">Портфоліо</a></li>
                <li><a href="about.html" id="link-about" data-key="nav_about">Про мене</a></li>
                <li><a href="blog.html" id="link-blog" data-key="nav_blog">Блог</a></li>
                <!-- АКТИВНИЙ СТАН НА КОНТАКТИ -->
                <li><a href="contact.html" id="link-contact" class="active-link btn-contact" data-key="nav_contact">Зв'язатися</a></li>
            </ul>
            <div class="lang-switch">
                <button class="lang-btn active-lang" onclick="setLang('uk')">UA</button>
                <button class="lang-btn" onclick="setLang('en')">EN</button>
            </div>
        </nav>
    </div>

    <!-- CONTACT CONTENT -->
    <section class="contact-container">
        <div class="contact-header">
            <h1 class="contact-title" data-key="contact_title">Зв'язатися</h1>
            <p class="contact-subtitle" data-key="contact_desc">Маєте проєкт або хочете навчатися? Оберіть зручний спосіб зв'язку.</p>
        </div>

        <div class="contact-grid">
            <!-- ЛІВА КОЛОНКА: Прямі контакти -->
            <div class="direct-contacts">
                <a href="mailto:your-email@example.com" class="contact-item">
                    <div class="contact-icon"><i class="fas fa-envelope"></i></div>
                    <div>
                        <div class="contact-label" data-key="label_email">Email</div>
                        <div class="contact-value">your-email@example.com</div>
                    </div>
                </a>
                
                <a href="https://t.me/Anotomic" target="_blank" class="contact-item">
                    <div class="contact-icon"><i class="fab fa-telegram-plane"></i></div>
                    <div>
                        <div class="contact-label" data-key="label_telegram">Telegram</div>
                        <div class="contact-value">@Anotomic</div>
                    </div>
                </a>

                <a href="https://www.artstation.com/anotomic" target="_blank" class="contact-item">
                    <div class="contact-icon"><i class="fab fa-artstation"></i></div>
                    <div>
                        <div class="contact-label">ArtStation</div>
                        <div class="contact-value">anotomic</div>
                    </div>
                </a>
            </div>

            <!-- ПРАВА КОЛОНКА: Форма -->
            <form class="contact-form" onsubmit="event.preventDefault(); alert('Дякую! Повідомлення надіслано.');">
                <div class="form-group">
                    <label class="form-label" data-key="form_name">Ваше ім'я</label>
                    <input type="text" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" data-key="form_email">Email</label>
                    <input type="email" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" data-key="form_message">Повідомлення</label>
                    <textarea class="form-textarea" required></textarea>
                </div>

                <button type="submit" class="submit-btn" data-key="form_btn">Надіслати повідомлення</button>
            </form>
        </div>
    </section>

    <!-- SCRIPT ДЛЯ МОВИ -->
    <script>
        const i18n = {
            uk: { 
                nav_home: "Головна", nav_port: "Портфоліо", nav_about: "Про мене", nav_blog: "Блог", nav_contact: "Зв'язатися",
                contact_title: "Зв'язатися",
                contact_desc: "Маєте проєкт або хочете навчатися? Оберіть зручний спосіб зв'язку.",
                label_email: "Email", label_telegram: "Telegram",
                form_name: "Ваше ім'я", form_email: "Email", form_message: "Повідомлення", form_btn: "Надіслати повідомлення"
            },
            en: { 
                nav_home: "Home", nav_port: "Portfolio", nav_about: "About", nav_blog: "Blog", nav_contact: "Contact Me",
                contact_title: "Contact Me",
                contact_desc: "Have a project or want to learn? Choose a convenient way to connect.",
                label_email: "Email", label_telegram: "Telegram",
                form_name: "Your Name", form_email: "Email", form_message: "Message", form_btn: "Send Message"
            }
        };

        function setLang(lang) {
            localStorage.setItem('site_lang', lang);
            document.querySelectorAll('[data-key]').forEach(el => { 
                const key = el.getAttribute('data-key'); 
                if(i18n[lang][key]) el.innerText = i18n[lang][key]; 
            });
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active-lang'));
            document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active-lang');
        }
        const savedLang = localStorage.getItem('site_lang') || 'uk'; setLang(savedLang);
    </script>
</body>
</html>
