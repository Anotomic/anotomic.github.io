<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Serhii Prytula</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="assets/images/favicon/Favicon_Serhii_Prytula.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap');

        :root {
            --bg-color: #0a0a0a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #ff6b35;
            --hud-bg: rgba(10, 10, 10, 0.85);
            --hud-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- HUD NAVIGATION (УЗГОДЖЕНО З INDEX) --- */
        .hud-wrapper { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: center; z-index: 1000; pointer-events: none; }
        .hud-nav { 
            pointer-events: auto; background: var(--hud-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); 
            border: 1px solid var(--hud-border); border-top: none; border-radius: 0 0 24px 24px; 
            padding: 22px 20px; width: 65%; max-width: 950px; 
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); transition: transform 0.3s ease; 
        }
        .nav-spacer { visibility: hidden; }
        .nav-links { display: flex; list-style: none; gap: 24px; justify-content: center; }
        .nav-links a { text-decoration: none; color: var(--text-muted); font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s; cursor: pointer; position: relative; }
        .nav-links a:hover, .nav-links a.active-link { color: var(--text-main); text-shadow: 0 0 12px rgba(255,255,255,0.3); }
        .nav-links a.active-link::after { content: ''; position: absolute; bottom: -6px; left: 0; width: 100%; height: 2px; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
        .btn-contact { border: 1px solid var(--accent); padding: 8px 20px; border-radius: 30px; color: var(--accent) !important; transition: all 0.3s; }
        .btn-contact:hover { background: var(--accent); color: #fff !important; box-shadow: 0 0 15px rgba(255, 107, 53, 0.4); }
        .btn-contact::after { display: none !important; }
        .lang-switch { display: flex; gap: 12px; justify-content: flex-end; padding-left: 15px; }
        .lang-btn { background: none; border: none; color: var(--text-muted); font-weight: 700; cursor: pointer; font-size: 15px; transition: color 0.3s; }
        .lang-btn.active-lang { color: var(--text-main); }

        /* --- PORTFOLIO SECTION --- */
        .portfolio-container { padding: 160px 20px 80px; max-width: 1600px; margin: 0 auto; }
        .portfolio-header { text-align: center; margin-bottom: 60px; }
        .portfolio-title { font-size: clamp(2rem, 4vw, 3rem); font-weight: 900; margin-bottom: 15px; color: var(--text-main); }
        .portfolio-subtitle { font-size: 1.1rem; color: var(--text-muted); max-width: 600px; margin: 0 auto; line-height: 1.6; }

        /* КВАДРАТНА СІТКА */
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .portfolio-item { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 1 / 1; background-color: #1e1e1e; cursor: pointer; }
        .portfolio-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .portfolio-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 25px; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 100%); opacity: 0; transform: translateY(10px); transition: all 0.3s ease; }
        .portfolio-item:hover .portfolio-img { transform: scale(1.05); }
        .portfolio-item:hover .portfolio-overlay { opacity: 1; transform: translateY(0); }
        .portfolio-item-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 5px; color: var(--text-main); }
        .portfolio-item-category { font-size: 0.85rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

        /* --- MODAL LIGHTBOX (MAX SIZE + BLUR BG) --- */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(10, 10, 10, 0.75); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 2000; display: none; justify-content: center; align-items: center; 
            opacity: 0; transition: opacity 0.3s ease; 
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        
        .modal-content { 
            width: 98%; max-width: 1800px; max-height: 95vh; 
            background: var(--hud-bg); border: 1px solid var(--hud-border); border-radius: 24px; 
            padding: 0; position: relative; overflow-y: auto; 
            box-shadow: 0 40px 100px rgba(0,0,0,0.9); 
            scrollbar-width: thin; scrollbar-color: var(--accent) rgba(255, 255, 255, 0.03);
        }

        .modal-inner-wrapper { padding: 50px; min-height: 100%; box-sizing: border-box; }
        
        /* CUSTOM SCROLLBAR */
        .modal-content::-webkit-scrollbar { width: 8px; }
        .modal-content::-webkit-scrollbar-track { background: transparent; margin: 24px 0; }
        .modal-content::-webkit-scrollbar-thumb {
            background: var(--accent); border-radius: 10px; border: 2px solid transparent;
            background-clip: content-box; margin-right: 16px;
        }
        .modal-content::-webkit-scrollbar-thumb:hover { background: #ff8c5a; }
        
        .modal-close { 
            position: absolute; top: 25px; right: 30px; background: none; border: none; 
            color: var(--text-muted); font-size: 2.2rem; cursor: pointer; transition: color 0.3s; z-index: 10; 
        }
        .modal-close:hover { color: var(--accent); }
        
        .modal-title { font-size: 2.2rem; font-weight: 900; margin-bottom: 10px; color: var(--text-main); text-align: center; }
        .modal-subtitle {
            font-size: 1rem; color: var(--accent); text-transform: uppercase;
            letter-spacing: 2px; font-weight: 600; text-align: center; margin-bottom: 40px;
        }

        /* ASYMMETRIC LAYOUT: 75% GALLERY / 25% TEXT */
        .modal-layout { display: grid; grid-template-columns: 3fr 1fr; gap: 50px; align-items: start; }
        .modal-gallery { display: flex; flex-direction: column; gap: 40px; align-items: center; }
        .modal-img { width: 100%; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-description { font-size: 0.9rem; line-height: 1.7; color: #b0b0b0; text-align: left; }
        .modal-description p { margin-bottom: 15px; }
        .modal-description p:last-child { margin-bottom: 0; }

        /* Адаптивність */
        @media (max-width: 1000px) {
            .hud-nav { grid-template-columns: 1fr; width: 90%; padding: 20px; gap: 15px; }
            .nav-spacer { display: none; }
            .nav-links { flex-wrap: wrap; justify-content: center; gap: 20px; }
            .lang-switch { justify-content: center; padding-left: 0; margin-top: 5px; }
            .portfolio-grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
            .portfolio-container { padding-top: 140px; }
            
            .modal-content { width: 98%; max-height: 90vh; }
            .modal-inner-wrapper { padding: 30px 20px; }
            .modal-title { font-size: 1.6rem; margin-bottom: 5px; }
            .modal-subtitle { font-size: 0.85rem; margin-bottom: 25px; }
            
            .modal-layout { grid-template-columns: 1fr; gap: 30px; }
            .modal-gallery { gap: 20px; }
            .modal-img { max-width: 100%; }
            .modal-description { font-size: 0.95rem; }
        }
        @media (max-width: 600px) { 
            .portfolio-grid { grid-template-columns: 1fr 1fr; } 
            .modal-close { top: 15px; right: 20px; font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <!-- HUD NAVIGATION -->
    <div class="hud-wrapper">
        <nav class="hud-nav">
            <div class="nav-spacer"></div>
            <ul class="nav-links">
                <li><a href="index.html" id="link-home" data-key="nav_home">Головна</a></li>
                <li><a href="portfolio.html" id="link-portfolio" class="active-link" data-key="nav_port">Портфоліо</a></li>
                <li><a href="about.html" id="link-about" data-key="nav_about">Про мене</a></li>
                <!-- ВКЛАДКА НАВЧАННЯ ВЖЕ ДОДАНА -->
                <li><a href="tutorials.html" id="link-tutorials" data-key="nav_tutorials">Навчання</a></li>
                <li><a href="blog.html" id="link-blog" data-key="nav_blog">Блог</a></li>
                <li><a href="contact.html" id="link-contact" class="btn-contact" data-key="nav_contact">Зв'язатися</a></li>
            </ul>
            <div class="lang-switch">
                <button class="lang-btn active-lang" onclick="setLang('uk')">UA</button>
                <button class="lang-btn" onclick="setLang('en')">EN</button>
            </div>
        </nav>
    </div>

    <!-- PORTFOLIO CONTENT -->
    <section class="portfolio-container">
        <div class="portfolio-header">
            <h1 class="portfolio-title" data-key="port_title">Портфоліо</h1>
            <p class="portfolio-subtitle" data-key="port_desc">Добірка моїх найкращих робіт у сфері 3D скульптингу.</p>
        </div>

        <div class="portfolio-grid">
            <!-- РОБОТА 1: ODIN -->
            <div class="portfolio-item" onclick="openModal('odin')">
                <img src="assets/images/portfolio/Odin/Odin-Thumbnail_Serhii_Prytula.jpg" alt="Odin King" class="portfolio-img">
                <div class="portfolio-overlay">
                    <div class="portfolio-item-title" data-key="odin_title">Odin - Realms of the Ascended</div>
                    <div class="portfolio-item-category" data-key="odin_cat">Character Game-Ready Production</div>
                </div>
            </div>

            <!-- РОБОТА 2: MJOLNIR -->
            <div class="portfolio-item" onclick="openModal('mjolnir')">
                <img src="assets/images/portfolio/Mjolnir/Mjolnir_Thumbnail_Serhii_Anotomic_Prytula_Preview.jpg" alt="Mjolnir Weapon" class="portfolio-img">
                <div class="portfolio-overlay">
                    <div class="portfolio-item-title" data-key="mjolnir_title">Mjolnir - Realms of the Ascended</div>
                    <div class="portfolio-item-category" data-key="mjolnir_cat">Game-Ready Weapon</div>
                </div>
            </div>
            
        </div>
    </section>

    <!-- MODAL OVERLAY -->
    <div class="modal-overlay" id="project-modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-inner-wrapper">
                <button class="modal-close" onclick="closeModal()">&times;</button>
                <h2 class="modal-title" id="modal-title">Project Title</h2>
                <p class="modal-subtitle" id="modal-subtitle">Category</p>
                
                <!-- ЛЕЙАУТ: ГАЛЕРЕЯ + ОПИС -->
                <div class="modal-layout">
                    <div class="modal-gallery" id="modal-gallery"></div>
                    <div class="modal-description" id="modal-desc"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script>
        // --- ПЕРЕЕКЛАДИ (УЗГОДЖЕНО З INDEX.HTML) ---
        const i18n = {
            uk: { 
                nav_home: "Головна", nav_port: "Портфоліо", nav_about: "Про мене", nav_tutorials: "Навчання", nav_blog: "Блог", nav_contact: "Зв'язатися", 
                port_title: "Портфоліо", 
                port_desc: "Добірка моїх найкращих робіт у сфері 3D скульптингу.",
                odin_title: "Одін - Царства Вознесених",
                odin_cat: "Створення ігрового персонажа",
                mjolnir_title: "Мйольнір - Царства Вознесених",
                mjolnir_cat: "Ігрова зброя"
            },
            en: { 
                nav_home: "Home", nav_port: "Portfolio", nav_about: "About", nav_tutorials: "Tutorials", nav_blog: "Blog", nav_contact: "Contact Me", 
                port_title: "Portfolio", 
                port_desc: "A collection of my best works in 3D sculpting.",
                odin_title: "Odin - Realms of the Ascended",
                odin_cat: "Character Game-Ready Production",
                mjolnir_title: "Mjolnir - Realms of the Ascended",
                mjolnir_cat: "Game-Ready Weapon"
            }
        };

        function setLang(lang) {
            localStorage.setItem('site_lang', lang);
            document.querySelectorAll('[data-key]').forEach(el => { 
                const key = el.getAttribute('data-key'); 
                if(i18n[lang][key]) el.innerText = i18n[lang][key]; 
            });
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active-lang'));
            document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active-lang');
        }
        const savedLang = localStorage.getItem('site_lang') || 'uk'; setLang(savedLang);

        // --- ЛОГІКА МОДАЛЬНОГО ВІКНА ---
        const projectsData = {
            'odin': {
                title_ua: 'Одін - Царства Вознесених', title_en: 'Odin - Realms of the Ascended',
                subtitle_ua: 'Створення ігрового персонажа', subtitle_en: 'Character Game-Ready Production',
                description_ua: `<p>Коли команда VisEterna Studio знову звернулася до мене з можливістю працювати над новим персонажем і поділилася концептом, це дало мені свіжий погляд на проєкт та сильне відчуття мотивації.</p><p>В результаті ми змогли наблизити фінальний вигляд персонажа максимально близько до того, як ми спочатку його задумували. Результат навіть перевершив мої власні очікування, встановивши новий якісний бенчмарк для всього проєкту.</p>`,
                description_en: `<p>When VisEterna Studio Team reached out to me again with an opportunity to work on a new character and shared the concept, it gave me a fresh perspective on the project and a strong sense of motivation.</p><p>As a result, we were able to bring the final look very close to how we originally envisioned the character. The outcome even exceeded my own expectations, setting a new quality benchmark for the project.</p>`,
                images: ['assets/images/portfolio/Odin/Odin-Full-Preview_Serhii_Prytula.jpg', 'assets/images/portfolio/Odin/Gungir_Odin_Serhii_Anotomic_Prytula.jpg']
            },
            'mjolnir': {
                title_ua: 'Мйольнір - Царства Вознесених', title_en: 'Mjolnir - Realms of the Ascended',
                subtitle_ua: 'Ігрова зброя', subtitle_en: 'Game-Ready Weapon',
                description_ua: `<p>Під час роботи над 3D-ассетами для проєкту "Realms of the Ascended" мені випала нагода створити не лише персонажів, а й ключові елементи ігрового спорядження.</p><p>Мені доручили створити нову версію Мйольніра за ідеєю команди VisEterna Studio. Головне завдання полягало в тому, щоб молот відображав символіку, пов'язану з Тором. Наприклад, ударна частина представлена двома козячими головами — Танньйострі та Таннніострі. У скандинавській міфології це козли, які тягнуть колісницю Тора.</p><p>Ідея використання двох козячих голів працює не лише символічно, а й візуально. Бодання — природна поведінка кіз, тому ця форма органічно вписується в дизайн самого Мйольніра.</p><p>Моє завдання полягало в тому, щоб провести ассет через повний game-ready пайплайн — від блокінгу та скульптингу моделі до текстурування й налаштування матеріалу в рушії.</p><p>Додатково ми створили дві "RGBA маски", які дозволяють змінювати кольори окремих частин моделі безпосередньо в грі. Це дає можливість надати практично кожній зоні Мйольніра власний колір, зберігаючи при цьому оригінальну текстуру.</p><p>Це був справді цікавий досвід для мене, тому я хотів поділитися ним з вами.</p>`,
                description_en: `<p>While working on 3D assets for the project "Realms of the Ascended", I sometimes get the opportunity to work not only on characters, but also on key pieces of in-game equipment.</p><p>I had the opportunity to create a new version of Mjolnir based on an idea proposed by the VisEterna Studio team. The main task was to create a hammer that would reflect the symbolism associated with Thor. For example, the striking part is represented by two goat heads — "Tanngnjóstr and Tanngrisnir". In Norse mythology, they are the goats that pull the chariot of Thor.</p><p>The idea of using two goat heads works not only symbolically, but visually as well. Head-butting is a natural behavior for goats, so this form fits organically into the design of Mjolnir itself.</p><p>My task was to take the asset through the full game-ready pipeline — from blocking and sculpting the model to texturing and setting up the material in the engine.</p><p>Additionally, we created two "RGBA masks" that allow the colors of individual parts of the model to be changed directly in the game. This makes it possible to give virtually every area of Mjolnir its own color, while preserving the original texture and allowing the color variation to be driven by it.</p><p>It was a really interesting experience for me, so I wanted to share it with you.</p>`,
                images: ['assets/images/portfolio/Mjolnir/Mjolnir_Serhii_Prytula_Render_Production_Preview.jpg', 'assets/images/portfolio/Mjolnir/Mjolnir_Upper_Preview_Serhii_Prytula.jpg', 'assets/images/portfolio/Mjolnir/Zbrush-Preview-Clay_Serhii_Prytula.jpg']
            }
        };

        const modal = document.getElementById('project-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalSubtitle = document.getElementById('modal-subtitle');
        const modalGallery = document.getElementById('modal-gallery');
        const modalDesc = document.getElementById('modal-desc');

        function openModal(projectId) {
            const project = projectsData[projectId];
            if (!project) return;

            modalGallery.innerHTML = '';
            modalDesc.innerHTML = '';
            
            const currentLang = localStorage.getItem('site_lang') || 'uk';
            modalTitle.innerText = currentLang === 'uk' ? project.title_ua : project.title_en;
            modalSubtitle.innerText = currentLang === 'uk' ? project.subtitle_ua : project.subtitle_en;
            modalDesc.innerHTML = currentLang === 'uk' ? project.description_ua : project.description_en;

            project.images.forEach(imgSrc => {
                const img = document.createElement('img');
                img.src = imgSrc; img.className = 'modal-img'; img.alt = project.title_en;
                modalGallery.appendChild(img);
            });

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(e) {
            if (!e || e.target === modal || e.target.classList.contains('modal-close')) {
                modal.classList.remove('active');
                document.body.style.overflow = '';
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) closeModal();
        });
    </script>
</body>
</html>
