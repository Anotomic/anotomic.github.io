<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Serhii Prytula</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap');

        :root {
            --bg-color: #0a0a0a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #ff6b35;
            --hud-bg: rgba(10, 10, 10, 0.6);
            --hud-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- HUD NAVIGATION (КОПІЯ З INDEX) --- */
        .hud-wrapper {
            position: fixed; top: 0; left: 0; right: 0;
            display: flex; justify-content: center; z-index: 1000; pointer-events: none;
        }
        .hud-nav {
            pointer-events: auto; background: var(--hud-bg);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--hud-border); border-top: none; 
            border-radius: 0 0 24px 24px; padding: 22px 30px; 
            width: 60%; max-width: 900px;
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }
        .nav-spacer { visibility: hidden; }
        .nav-links { display: flex; list-style: none; gap: 35px; justify-content: center; }
        .nav-links a {
            text-decoration: none; color: var(--text-muted); font-size: 15px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s; cursor: pointer; position: relative;
        }
        .nav-links a:hover, .nav-links a.active-link { color: var(--text-main); text-shadow: 0 0 12px rgba(255,255,255,0.3); }
        .nav-links a.active-link::after {
            content: ''; position: absolute; bottom: -6px; left: 0; width: 100%; height: 2px;
            background: var(--accent); box-shadow: 0 0 8px var(--accent);
        }
        .btn-contact {
            border: 1px solid var(--accent); padding: 8px 20px; border-radius: 30px;
            color: var(--accent) !important; transition: all 0.3s;
        }
        .btn-contact:hover { background: var(--accent); color: #fff !important; box-shadow: 0 0 15px rgba(255, 107, 53, 0.4); }
        .btn-contact::after { display: none !important; }
        .lang-switch { display: flex; gap: 12px; justify-content: flex-end; padding-left: 20px; }
        .lang-btn { background: none; border: none; color: var(--text-muted); font-weight: 700; cursor: pointer; font-size: 15px; transition: color 0.3s; }
        .lang-btn.active-lang { color: var(--text-main); }

        /* --- PORTFOLIO SECTION STYLES --- */
        .portfolio-container {
            padding: 160px 20px 80px; /* Відступ від HUD */
            max-width: 1600px;
            margin: 0 auto;
        }

        .portfolio-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .portfolio-title {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 900;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .portfolio-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Галерея Grid */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }

        .portfolio-item {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 4/3; /* Співвідношення сторін карток */
            background-color: #1e1e1e;
            cursor: pointer;
            group: portfolio;
        }

        .portfolio-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .portfolio-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 30px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }

        .portfolio-item:hover .portfolio-img {
            transform: scale(1.05);
        }

        .portfolio-item:hover .portfolio-overlay {
            opacity: 1;
            transform: translateY(0);
        }

        .portfolio-item-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--text-main);
        }

        .portfolio-item-category {
            font-size: 0.9rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Адаптивність */
        @media (max-width: 1000px) {
            .hud-nav { grid-template-columns: 1fr; width: 90%; padding: 20px; gap: 15px; }
            .nav-spacer { display: none; }
            .nav-links { flex-wrap: wrap; justify-content: center; gap: 20px; }
            .lang-switch { justify-content: center; padding-left: 0; margin-top: 5px; }
            
            .portfolio-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 20px;
            }
            .portfolio-container { padding-top: 140px; }
        }

        @media (max-width: 600px) {
            .portfolio-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- HUD NAVIGATION -->
    <div class="hud-wrapper">
        <nav class="hud-nav">
            <div class="nav-spacer"></div>
            <ul class="nav-links">
                <li><a href="index.html" id="link-home" data-key="nav_home">Головна</a></li>
                <!-- АКТИВНИЙ СТАН НА ПОРТФОЛІО -->
                <li><a href="portfolio.html" id="link-portfolio" class="active-link" data-key="nav_port">Портфоліо</a></li>
                <li><a href="about.html" id="link-about" data-key="nav_about">Про мене</a></li>
                <li><a href="blog.html" id="link-blog" data-key="nav_blog">Блог</a></li>
                <li><a href="contact.html" id="link-contact" class="btn-contact" data-key="nav_contact">Зв'язатися</a></li>
            </ul>
            <div class="lang-switch">
                <button class="lang-btn active-lang" onclick="setLang('uk')">UA</button>
                <button class="lang-btn" onclick="setLang('en')">EN</button>
            </div>
        </nav>
    </div>

    <!-- PORTFOLIO CONTENT -->
    <section class="portfolio-container">
        <div class="portfolio-header">
            <h1 class="portfolio-title" data-key="port_title">Портфоліо</h1>
            <p class="portfolio-subtitle" data-key="port_desc">Добірка моїх найкращих робіт у сфері 3D скульптингу, текстурування та рендерингу персонажів.</p>
        </div>

        <div class="portfolio-grid">
            <!-- ПРИКЛАД РОБОТИ 1 -->
            <div class="portfolio-item">
                <!-- ЗАМІНИ src НА СВОЮ КАРТИНКУ -->
                <img src="Mjolnir__Upper_Preview_Serhii_Anotomic_Prytula.jpg" alt="Mjolnir Character" class="portfolio-img">
                <div class="portfolio-overlay">
                    <div class="portfolio-item-title">Mjolnir Warrior</div>
                    <div class="portfolio-item-category">Character Sculpting</div>
                </div>
            </div>

            <!-- ПРИКЛАД РОБОТИ 2 -->
            <div class="portfolio-item">
                <img src="Odin_Full_Preview_Front_Serhii_Anotomic_Prytula.jpg" alt="Odin Character" class="portfolio-img">
                <div class="portfolio-overlay">
                    <div class="portfolio-item-title">Odin King</div>
                    <div class="portfolio-item-category">Full Body Render</div>
                </div>
            </div>

            <!-- ДОДАЙ БІЛЬШЕ БЛОКІВ portfolio-item ТУТ -->
            
        </div>
    </section>

    <!-- SCRIPT ДЛЯ МОВИ -->
    <script>
        const i18n = {
            uk: { 
                nav_home: "Головна", nav_port: "Портфоліо", nav_about: "Про мене", nav_blog: "Блог", nav_contact: "Зв'язатися",
                port_title: "Портфоліо", 
                port_desc: "Добірка моїх найкращих робіт у сфері 3D скульптингу, текстурування та рендерингу персонажів."
            },
            en: { 
                nav_home: "Home", nav_port: "Portfolio", nav_about: "About", nav_blog: "Blog", nav_contact: "Contact Me",
                port_title: "Portfolio", 
                port_desc: "A collection of my best works in 3D sculpting, texturing, and character rendering."
            }
        };

        function setLang(lang) {
            localStorage.setItem('site_lang', lang);
            document.querySelectorAll('[data-key]').forEach(el => { 
                const key = el.getAttribute('data-key'); 
                if(i18n[lang][key]) el.innerText = i18n[lang][key]; 
            });
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active-lang'));
            document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active-lang');
        }

        const savedLang = localStorage.getItem('site_lang') || 'uk'; setLang(savedLang);
    </script>
</body>
</html>
